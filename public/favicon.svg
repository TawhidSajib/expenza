<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#05df5b" />
    </linearGradient>
  </defs>

  <!-- Dark container background for high visibility on both light and dark browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#09090b" stroke="#00FF66" stroke-width="2" stroke-opacity="0.45" />
  <circle cx="32" cy="32" r="24" fill="url(#bg-glow)" />

  <!-- NotebookTabs Lucide Icon in Vivid Neon Green -->
  <g transform="translate(10, 10) scale(1.833)" stroke="url(#neon-stroke)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)">
    <!-- Binder ring tabs on the left spine -->
    <path d="M2 6h4" />
    <path d="M2 10h4" />
    <path d="M2 14h4" />
    <path d="M2 18h4" />

    <!-- Notebook body -->
    <rect width="16" height="20" x="4" y="2" rx="2" fill="#00FF66" fill-opacity="0.08" />

    <!-- Vertical bookmark/tab separator -->
    <path d="M15 2v20" stroke-opacity="0.75" />

    <!-- Notebook index tabs -->
    <path d="M15 7h5" />
    <path d="M15 12h5" />
    <path d="M15 17h5" />
  </g>
</svg>
